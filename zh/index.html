<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小音豆｜乐理基础练习</title>
  <meta name="description" content="小音豆是一款面向音乐初学者的乐理基础练习 App，支持识谱、听音、节奏和音程练习。">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--cp-text);
      background: var(--cp-bg);
      line-height: 1.7;
    }
    main { max-width: 820px; margin: 0 auto; padding: 48px 20px; }
    nav { display: flex; justify-content: flex-end; margin-bottom: 16px; }
    nav a, .links a {
      color: var(--cp-accent);
      font-weight: 600;
      text-decoration: none;
    }
    nav a:hover, .links a:hover { color: var(--cp-accent-hover); text-decoration: underline; }
    .card {
      padding: 32px;
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 2.75rem); line-height: 1.2; }
    h2 { margin: 32px 0 12px; font-size: 1.3rem; }
    p { margin: 12px 0; }
    .lead { color: var(--cp-text-muted); font-size: 1.08rem; }
    .features { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
    .feature { padding: 16px; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); border-radius: 0.625rem; }
    .feature strong { display: block; margin-bottom: 4px; }
    .feature span { color: var(--cp-text-muted); }
    .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .links a { padding: 9px 14px; background: var(--cp-accent-soft); border-radius: 0.625rem; }
    @media (max-width: 580px) {
      main { padding: 24px 16px; }
      .card { padding: 24px 20px; }
      .features { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <nav aria-label="语言">
      <a href="../" lang="en">English</a>
    </nav>
    <section class="card">
      <h1>小音豆</h1>
      <p class="lead">面向音乐初学者的乐理基础练习 App。</p>
      <p>通过识谱、听音、节奏和音程四种练习模式，在轻松的挑战中巩固乐理基础。识谱、听音和音程练习支持钢琴与小提琴。</p>

      <div class="features" aria-label="练习模式">
        <div class="feature"><strong>识谱</strong><span>练习辨认五线谱上的音符。</span></div>
        <div class="feature"><strong>听音</strong><span>聆听音高并选择正确答案。</span></div>
        <div class="feature"><strong>节奏</strong><span>学习并辨认常见节奏型。</span></div>
        <div class="feature"><strong>音程</strong><span>练习辨认音符之间的距离。</span></div>
      </div>

      <h2>简单、私密、专注练习</h2>
      <p>App 支持简体中文和英文，无需登录，无广告、无应用内购买。昵称、头像、设置和练习进度仅保存在设备本机。</p>

      <div class="links">
        <a href="privacy.html">隐私政策</a>
        <a href="support.html">支持与帮助</a>
      </div>
    </section>
  </main>
</body>
</html>
